<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>vn-cccd-scanner demo</title>
    <style>
      body {
        font-family: system-ui, sans-serif;
        margin: 2rem;
      }
      button {
        margin: 1rem 0.5rem 0 0;
        padding: 0.5rem 1rem;
      }
      pre {
        background: #f4f4f4;
        padding: 1rem;
        border-radius: 8px;
        white-space: pre-wrap;
      }
    </style>
  </head>
  <body>
    <h1>vn-cccd-scanner — demo component</h1>
    <vn-cccd-scanner id="scanner" facing-mode="environment"></vn-cccd-scanner>
    <div>
      <button id="start" type="button">Bật camera</button>
      <button id="stop" type="button">Tắt camera</button>
      <button id="rescan" type="button">Quét lại</button>
    </div>
    <h2>Kết quả</h2>
    <pre id="result">Chưa có kết quả</pre>
    <script type="module" src="/demo/main.ts"></script>
  </body>
</html>
