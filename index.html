<!doctype html>
<!--
  type: software · site-kind: software · one-page demo, no marketing nav/footer
  deal: palette three-stones + blue primary (client override) · epilogue + JetBrains Mono · buttons solid · soft
  Focus: scan with webcam → 7 fields fill into a form, like a real integration.
-->
<html lang="vi" data-type="software" data-radius="soft" data-buttons="solid" data-motion>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>vn-cccd-scanner: quét QR CCCD bằng webcam trong trình duyệt</title>
<meta name="description" content="Thư viện quét mã QR trên CCCD Việt Nam bằng webcam, trả về bảy trường dữ liệu có cấu trúc, chạy hoàn toàn trong trình duyệt.">
<meta property="og:type" content="website">
<meta property="og:title" content="vn-cccd-scanner: quét QR CCCD bằng webcam">
<meta property="og:description" content="Đọc QR CCCD bằng webcam, trả về bảy trường dữ liệu, không gửi dữ liệu đi đâu.">
<meta property="og:image" content="share.jpg">
<meta name="twitter:card" content="summary_large_image">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<meta name="theme-color" content="#eeecea">
<!-- <link rel="canonical" href="https://the client's domain/"> -->
<meta name="site-kind" content="software">
<meta name="page-type" content="software">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Epilogue:wght@400..700&family=JetBrains+Mono:wght@400..500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/system.css">
<link rel="stylesheet" href="assets/ui/cards.css">
<link rel="stylesheet" href="assets/motion/motion.css">
<link rel="stylesheet" href="assets/backgrounds/backgrounds.css">
<link rel="stylesheet" href="assets/layout/layout.css">
<link rel="stylesheet" href="assets/icons/icon.css">
<style>
:root {
  --p-bg: #eeecea; --p-surface: #e4e1dd; --p-ink: #333231; --p-muted: #625f5b;
  --p-accent: #0d6efd; --p-accent-ink: #ffffff; --p-action: #0d6efd; --p-action-ink: #ffffff;
  --p-inv-bg: #333231; --p-inv-surface: #3e3d3c; --p-inv-ink: #eeecea; --p-inv-muted: #adaba9;
  --p-inv-accent: #eeecea; --p-inv-accent-ink: #333231; --p-inv-action: #eeecea; --p-inv-action-ink: #333231;
  --font-display: "Epilogue", system-ui, sans-serif;
  --font-text: "Epilogue", system-ui, sans-serif;
  --font-mono: "JetBrains Mono", ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
  --display-weight: 400;
  --display-tracking: -0.035em;
  --display-tracking-xl: -0.045em;
  --ly-scale: 0.97;
}
</style>
<script>document.documentElement.classList.add('m-enter');setTimeout(()=>document.documentElement.classList.add('m-enter-done'),700)</script>
<script src="assets/backgrounds/backgrounds.js"></script>

<style>
  body { background: var(--p-bg); }
  .demo { --p-h: 0; }
  main > section > .wrap.grid.demo__grid { align-items: start; }
  .demo__camera { grid-column: span 5; }
  .demo__side { grid-column: span 7; }
  .demo__camera { background: var(--p-surface); border-radius: var(--r-lg); padding: var(--s-6); }
  .demo__camera > vn-cccd-scanner { display: block; width: 100%; max-width: 320px; margin: 0 auto var(--s-5); }
  .demo__camera .demo__actions { justify-content: center; }
  .demo__camera .status { text-align: center; }
  /* Buttons: keep the kit look; only the primary keeps the Bootstrap blue. */
  .demo__actions .btn--primary { background: var(--action); color: var(--action-ink); }
  .demo__side { height: auto; }
  .demo__side h1 { font-size: clamp(36px, 3vw, 48px); line-height: 1.05; letter-spacing: var(--display-tracking-xl); margin: 0 0 var(--s-4); }
  .demo__lead { font-size: var(--t-lead); line-height: 1.5; color: var(--muted); max-width: 34ch; margin: 0 0 var(--s-5); }
  .demo__actions { display: flex; flex-wrap: wrap; gap: var(--s-3); }
  .status { font-size: 14px; color: var(--muted); min-height: 1.5em; margin: var(--s-4) 0 0; }
  .status[data-kind='error'] { color: #a23636; }
  .status[data-kind='success'] { color: var(--accent); }
  .form-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: var(--s-3); margin-top: var(--s-6); }
  .field { display: grid; gap: var(--s-1); }
  .field--wide { grid-column: 1 / -1; }
  .field label { font-size: 13px; font-weight: 500; color: var(--muted); }
  .field input { height: 44px; width: 100%; padding: 0 var(--s-3); font: 16px/1 var(--font-text); color: var(--ink); background: var(--p-bg); border: 1px solid var(--line-strong); border-radius: var(--r-sm); }
  .field input:focus-visible { outline: 2px solid var(--action); outline-offset: 1px; }
  @media (max-width: 1023px) { .wrap.demo__grid { grid-template-columns: 1fr; } .demo__side h1 { font-size: 36px; } }
  @media (max-width: 639px) { .form-grid { grid-template-columns: 1fr; } .demo__camera { padding: var(--s-5); } .demo__actions .btn { width: 100%; } }
</style>
</head>
<body>
<a class="skip-link" href="#top">Chuyển tới nội dung</a>
<main id="top">
  <section class="section section--hero demo" id="scan" style="--h: 1; --p-h: 0">
    <div class="wrap grid demo__grid">
      <div class="demo__camera" data-enter>
        <vn-cccd-scanner id="scanner" facing-mode="environment" aria-label="Khung quét mã QR CCCD"></vn-cccd-scanner>
        <div class="demo__actions">
          <button class="btn btn--primary" id="start" type="button">Bật camera</button>
          <button class="btn btn--secondary" id="stop" type="button">Tắt camera</button>
          <button class="btn btn--secondary" id="rescan" type="button">Quét lại</button>
        </div>
        <p class="status" id="status" role="status" aria-live="polite">Chưa bật camera</p>
      </div>

      <div class="demo__side" data-enter>
        <h1>Quét QR CCCD bằng webcam</h1>
        <form class="form-grid" id="cccd-form" novalidate>
          <div class="field">
            <label for="f-id">Số định danh</label>
            <input id="f-id" name="id" type="text" autocomplete="off" readonly>
          </div>
          <div class="field">
            <label for="f-legacy">CMND cũ</label>
            <input id="f-legacy" name="legacyId" type="text" autocomplete="off" readonly>
          </div>
          <div class="field">
            <label for="f-name">Họ tên</label>
            <input id="f-name" name="name" type="text" autocomplete="off" readonly>
          </div>
          <div class="field">
            <label for="f-dob">Ngày sinh</label>
            <input id="f-dob" name="dob" type="text" autocomplete="off" readonly>
          </div>
          <div class="field">
            <label for="f-gender">Giới tính</label>
            <input id="f-gender" name="gender" type="text" autocomplete="off" readonly>
          </div>
          <div class="field">
            <label for="f-issue">Ngày cấp</label>
            <input id="f-issue" name="issueDate" type="text" autocomplete="off" readonly>
          </div>
          <div class="field field--wide">
            <label for="f-place">Quê quán</label>
            <input id="f-place" name="nativePlace" type="text" autocomplete="off" readonly>
          </div>
        </form>
      </div>
    </div>
  </section>
</main>
<script type="module" src="/demo/main.ts"></script>
</body>
</html>
